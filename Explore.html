<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore | CoderAlyan</title>
    <link rel="icon" type="image/png" href="ChatGPT Image Aug 22, 2026, 07_30_36 AM.png" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: #f4f7ff;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 80px 24px;
      }

      .section {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03);
        padding: 40px 24px;
      }

      h2 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        color: #ffffff;
      }

      .search-bar {
        margin-top: 20px;
        width: 100%;
        max-width: 360px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: #f4f7ff;
        font-size: 1rem;
      }

      .search-bar::placeholder {
        color: rgba(244, 247, 255, 0.45);
      }

      .search-bar:focus {
        outline: none;
        border-color: #22d3ee;
      }

      .no-results {
        display: none;
        margin-top: 16px;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .azha-brand-label {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .azha-brand-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      }

      .azha-brand-text {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="section">
        <a href="index.html" style="display: inline-block; margin-bottom: 20px; padding: 12px 20px; background: rgba(255, 255, 255, 0.06); color: #e2e8f0; text-decoration: none; font-weight: 700; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);">Return</a>
        <h2>Other Coder Alyan Websites</h2>
        <br />
        <input
          type="text"
          id="siteSearch"
          class="search-bar"
          placeholder="Search websites..."
        />
        <div id="siteLinks" style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px;">
          <a href="https://google2o.base44.app/" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: white; text-decoration: none; font-weight: 700; border-radius: 999px; box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);">Google 2.0</a>
          <a href="https://pitch-master-silky-play.base44.app/" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: white; text-decoration: none; font-weight: 700; border-radius: 999px; box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);">Pitch Master</a>
          <a href="https://citycrafter.base44.app/" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: white; text-decoration: none; font-weight: 700; border-radius: 999px; box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);">City Crafter</a>
        </div>
        <p class="no-results" id="noResults">No websites match your search.</p>
      </section>
    </main>
    <div class="azha-brand">
      <span class="azha-brand-label">Created by</span>
      <div class="azha-brand-row">
        <img src="azha-logo.png" alt="AZHA MOH logo" class="azha-brand-logo" />
        <span class="azha-brand-text">AZHA MOH</span>
      </div>
    </div>

    <script>
      const searchInput = document.getElementById('siteSearch');
      const links = Array.from(document.querySelectorAll('#siteLinks a'));
      const noResults = document.getElementById('noResults');

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim().toLowerCase();
        let visibleCount = 0;

        links.forEach((link) => {
          const matches = link.textContent.toLowerCase().includes(query);
          link.style.display = matches ? '' : 'none';
          if (matches) visibleCount++;
        });

        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
      });
    </script>
  </body>
</html>
