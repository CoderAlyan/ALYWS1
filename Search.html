<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | CoderAlyan</title>
    <link rel="icon" type="image/png" href="ChatGPT Image Aug 22, 2026, 07_30_36 AM.png" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: #f4f7ff;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 80px 24px;
      }

      .return-btn {
        display: inline-block;
        margin-bottom: 20px;
        padding: 12px 20px;
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
        text-decoration: none;
        font-weight: 700;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .section {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03);
        padding: 40px 24px;
      }

      h2 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        color: #ffffff;
      }

      .subtitle {
        margin: 10px 0 0;
        color: rgba(244, 247, 255, 0.7);
      }

      .search-bar {
        margin-top: 20px;
        width: 100%;
        max-width: 480px;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: #f4f7ff;
        font-size: 1.05rem;
      }

      .search-bar::placeholder {
        color: rgba(244, 247, 255, 0.45);
      }

      .search-bar:focus {
        outline: none;
        border-color: #22d3ee;
      }

      .no-results {
        display: none;
        margin-top: 16px;
        color: rgba(244, 247, 255, 0.6);
      }

      .result-count {
        margin-top: 20px;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.5);
      }

      .result-list {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .result-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        text-decoration: none;
        color: #f4f7ff;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .result-card:hover {
        transform: translateY(-2px);
        border-color: #22d3ee;
      }

      .result-info h3 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        color: #ffffff;
      }

      .result-info p {
        margin: 0;
        font-size: 0.85rem;
        color: rgba(244, 247, 255, 0.65);
      }

      .badge {
        flex-shrink: 0;
        display: inline-block;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        color: white;
        white-space: nowrap;
      }

      .azha-brand {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .azha-brand-label {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .azha-brand-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      }

      .azha-brand-text {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="section">
        <a href="index.html" class="return-btn">Return</a>
        <h2>Search</h2>
        <p class="subtitle">Find anything across CoderAlyan.</p>

        <input
          type="text"
          id="siteSearch"
          class="search-bar"
          placeholder="Search pages, games, players, links..."
          autofocus
        />

        <p class="result-count" id="resultCount"></p>
        <div class="result-list" id="resultList"></div>
        <p class="no-results" id="noResults">Nothing matches your search.</p>
      </section>
    </main>

    <div class="azha-brand">
      <span class="azha-brand-label">Created by</span>
      <div class="azha-brand-row">
        <img src="azha-logo.png" alt="AZHA MOH logo" class="azha-brand-logo" />
        <span class="azha-brand-text">AZHA MOH</span>
      </div>
    </div>

    <script>
      const SEARCH_INDEX = [
        { title: 'Home', category: 'Page', description: 'CoderAlyan landing page.', link: 'index.html' },
        { title: 'Explore Other Websites', category: 'Page', description: 'Links to other Coder Alyan projects.', link: 'Explore.html' },
        { title: "Let's Talk", category: 'Page', description: 'Get in touch.', link: 'Talk.html' },
        { title: 'Info', category: 'Page', description: 'About this build.', link: 'Info.html' },
        { title: 'Soccer Player Stats', category: 'Page', description: 'Season stats for standout soccer players.', link: 'PlayerStats.html' },
        { title: 'Games', category: 'Page', description: 'Play games right in the browser.', link: 'Games.html' },

        { title: 'Google 2.0', category: 'Website', description: 'External project by Coder Alyan.', link: 'https://google2o.base44.app/' },
        { title: 'Pitch Master', category: 'Website', description: 'External project by Coder Alyan.', link: 'https://pitch-master-silky-play.base44.app/' },
        { title: 'City Crafter', category: 'Website', description: 'External project by Coder Alyan.', link: 'https://citycrafter.base44.app/' },

        { title: 'Tic-Tac-Toe', category: 'Game', description: 'Classic two-player X\'s and O\'s.', link: 'Games.html' },
        { title: 'Memory Match', category: 'Game', description: 'Flip cards and find every pair.', link: 'Games.html' },
        { title: 'Rock Paper Scissors', category: 'Game', description: 'Beat the computer, best of luck.', link: 'Games.html' },
        { title: 'War', category: 'Game', description: 'Highest card takes the pot, against the AI.', link: 'Games.html' },

        { title: 'Lionel Messi', category: 'Player', description: 'Forward, Inter Miami.', link: 'PlayerStats.html' },
        { title: 'Erling Haaland', category: 'Player', description: 'Forward, Manchester City.', link: 'PlayerStats.html' },
        { title: 'Kevin De Bruyne', category: 'Player', description: 'Midfielder, Manchester City.', link: 'PlayerStats.html' },
        { title: 'Virgil van Dijk', category: 'Player', description: 'Defender, Liverpool.', link: 'PlayerStats.html' },
        { title: 'Alisson Becker', category: 'Player', description: 'Goalkeeper, Liverpool.', link: 'PlayerStats.html' },
      ];

      const searchInput = document.getElementById('siteSearch');
      const resultList = document.getElementById('resultList');
      const resultCount = document.getElementById('resultCount');
      const noResults = document.getElementById('noResults');

      function renderResults(query) {
        const q = query.trim().toLowerCase();
        const matches = SEARCH_INDEX.filter((item) => {
          return (
            item.title.toLowerCase().includes(q) ||
            item.category.toLowerCase().includes(q) ||
            item.description.toLowerCase().includes(q)
          );
        });

        resultList.innerHTML = '';
        matches.forEach((item) => {
          const card = document.createElement('a');
          card.className = 'result-card';
          card.href = item.link;
          if (item.link.startsWith('http')) {
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
          }

          card.innerHTML = `
            <div class="result-info">
              <h3>${item.title}</h3>
              <p>${item.description}</p>
            </div>
            <span class="badge">${item.category}</span>
          `;
          resultList.appendChild(card);
        });

        noResults.style.display = matches.length === 0 ? 'block' : 'none';
        resultCount.textContent = q
          ? `${matches.length} result${matches.length === 1 ? '' : 's'}`
          : `${matches.length} items`;
      }

      searchInput.addEventListener('input', () => renderResults(searchInput.value));
      renderResults('');
    </script>
  </body>
</html>
