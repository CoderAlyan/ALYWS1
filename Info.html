<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1a1f35 0%, #0b1020 35%, #05070d 100%);
        color: #f4f7ff;
      }

      .hero {
        text-align: center;
        padding: 48px 24px;
        max-width: 1200px;
      }

      .eyebrow {
        margin: 0 0 18px;
        font-size: 0.8rem;
        letter-spacing: 0.35rem;
        text-transform: uppercase;
        color: #7dd3fc;
      }

      .logo {
        display: block;
        width: min(35vw, 350px);
        max-width: 100%;
        margin: 0 auto 8px;
        filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.5));
      }

      .coderalyan {
        margin: 0;
        font-size: clamp(3rem, 10vw, 9rem);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.08em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        animation: glow 3s ease-in-out infinite alternate;
      }

      .tagline {
        margin: 20px auto 0;
        max-width: 760px;
        font-size: clamp(1rem, 2vw, 1.5rem);
        color: rgba(244, 247, 255, 0.8);
      }

      .buttons {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .buttons a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .buttons a:hover {
        transform: translateY(-2px);
      }

      .buttons a:first-child {
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        color: white;
        box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);
      }

      .buttons a.secondary {
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 16px rgba(139, 92, 246, 0.45), 0 0 28px rgba(34, 211, 238, 0.25);
        }
        to {
          text-shadow: 0 0 22px rgba(34, 211, 238, 0.6), 0 0 38px rgba(167, 243, 208, 0.35);
        }
      }

      .azha-brand {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .azha-brand-label {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .azha-brand-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      }

      .azha-brand-text {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }
      </style>
  </head>
  <body>
